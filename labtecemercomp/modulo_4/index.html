<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laboratorio Módulo 4: Reto Integrador - Control Secuencial</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene background="color: #0b0f19">

    <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #38bdf8; intensity: 1.0" position="0 4 2"></a-entity>

    <a-camera position="0 1.6 0">
      <a-cursor raycaster="objects: .clicable" color="#38bdf8" fuse="true" fuse-timeout="1000" scale="0.8 0.8 0.8"></a-cursor>
    </a-camera>

    <a-entity position="0 2.2 -3">
      <a-box id="panel-led" width="2.4" height="0.7" depth="0.08" material="color: #0f172a; metalness: 0.8; roughness: 0.2">
      </a-box>
      <a-text id="texto-estado" value="INGRESE SECUENCIA\n[ _ _ _ ]" position="0 0 0.05" align="center" color="#38bdf8" scale="0.45 0.45 0.45">
      </a-text>
    </a-entity>

    <a-box class="clicable" id="btn-1" position="-1.0 1.3 -3" width="0.6" height="0.6" depth="0.2" color="#334155">
      <a-text value="1" position="0 0 0.12" align="center" scale="1 1 1" color="#ffffff"></a-text>
    </a-box>

    <a-box class="clicable" id="btn-2" position="0 1.3 -3" width="0.6" height="0.6" depth="0.2" color="#334155">
      <a-text value="2" position="0 0 0.12" align="center" scale="1 1 1" color="#ffffff"></a-text>
    </a-box>

    <a-box class="clicable" id="btn-3" position="1.0 1.3 -3" width="0.6" height="0.6" depth="0.2" color="#334155">
      <a-text value="3" position="0 0 0.12" align="center" scale="1 1 1" color="#ffffff"></a-text>
    </a-box>

    <a-entity id="puerta-industrial" position="0 1.8 -4.5">
      <a-box position="-1.3 0 0" width="0.2" height="2.8" depth="0.2" color="#475569"></a-box>
      <a-box position="1.3 0 0" width="0.2" height="2.8" depth="0.2" color="#475569"></a-box>
      <a-box position="0 1.4 0" width="2.8" height="0.2" depth="0.2" color="#475569"></a-box>
      <a-box id="hoja-puerta" position="0 0 0" width="2.4" height="2.6" depth="0.08" color="#1e293b" material="roughness: 0.4; metalness: 0.6">
        <a-text value="PUERTA DE SEGURIDAD" position="0 0 0.06" align="center" scale="0.4 0.4 0.4" color="#94a3b8"></a-text>
      </a-box>
    </a-entity>

    <a-grid position="0 0 0" color="#1e293b"></a-grid>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const CLAVE_SECRETA = [2, 1, 3];
      let bufferEntrada = [];
      let bloqueado = false;

      const panelLed = document.querySelector('#panel-led');
      const textoEstado = document.querySelector('#texto-estado');
      const hojaPuerta = document.querySelector('#hoja-puerta');
      const botones = [1, 2, 3].map(n => ({
        num: n,
        el: document.querySelector(`#btn-${n}`)
      }));

      botones.forEach(item => {
        item.el.addEventListener('mouseenter', () => {
          if (!bloqueado) item.el.setAttribute('material', 'color', '#f59e0b');
        });
        item.el.addEventListener('mouseleave', () => {
          if (!bloqueado) item.el.setAttribute('material', 'color', '#334155');
        });
        
        item.el.addEventListener('click', () => {
          if (bloqueado) return;
          procesarEntrada(item.num, item.el);
        });
      });

      function procesarEntrada(digito, elementoBtn) {
        elementoBtn.setAttribute('material', 'color', '#38bdf8');
        setTimeout(() => elementoBtn.setAttribute('material', 'color', '#334155'), 200);

        bufferEntrada.push(digito);
        console.log('[FSM] Secuencia actual:', bufferEntrada);

        const visor = bufferEntrada.join(' - ');
        textoEstado.setAttribute('value', `INGRESANDO:\n[ ${visor} ]`);
        textoEstado.setAttribute('color', '#38bdf8');

        const indiceActual = bufferEntrada.length - 1;
        if (bufferEntrada[indiceActual] !== CLAVE_SECRETA[indiceActual]) {
          ejecutarFalloSecuencia();
          return;
        }

        if (bufferEntrada.length === CLAVE_SECRETA.length) {
          ejecutarAccesoConcedido();
        }
      }

      function ejecutarAccesoConcedido() {
        bloqueado = true;
        panelLed.setAttribute('material', 'color', '#10b981'); 
        textoEstado.setAttribute('value', '¡ACCESO CONCEDIDO!\nABRIENDO COMPUERTA...');
        textoEstado.setAttribute('color', '#ffffff');

        hojaPuerta.setAttribute('animation__subir', {
          property: 'position',
          to: '0 3.0 0',
          dur: 2000,
          easing: 'easeInOutQuad'
        });
        hojaPuerta.setAttribute('animation__opacidad', {
          property: 'material.opacity',
          to: '0.1',
          dur: 2000,
          easing: 'easeInOutQuad'
        });

        console.log('[FSM] SECUENCIA CORRECTA [2, 1, 3]. Protocolo de apertura ejecutado.');
      }

      function ejecutarFalloSecuencia() {
        bloqueado = true;
        panelLed.setAttribute('material', 'color', '#ef4444'); // Rojo
        textoEstado.setAttribute('value', '¡ERROR DE SECUENCIA!\nBUFFER REINICIADO');
        textoEstado.setAttribute('color', '#ffffff');

        let parpadeos = 0;
        const intervalo = setInterval(() => {
          parpadeos++;
          const colorActual = panelLed.getAttribute('material').color;
          panelLed.setAttribute('material', 'color', colorActual === '#ef4444' ? '#0f172a' : '#ef4444');

          if (parpadeos >= 4) {
            clearInterval(intervalo);
            bufferEntrada = [];
            panelLed.setAttribute('material', 'color', '#0f172a');
            textoEstado.setAttribute('value', 'INGRESE SECUENCIA\n[ _ _ _ ]');
            textoEstado.setAttribute('color', '#38bdf8');
            bloqueado = false;
            console.warn('[FSM] Buffer reseteado tras secuencia inválida.');
          }
        }, 250);
      }
    });
  </script>
</body>
</html>
