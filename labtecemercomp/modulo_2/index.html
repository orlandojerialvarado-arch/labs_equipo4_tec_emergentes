<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <title>Laboratorio - Módulo 2:
WebAR Industrial</title> <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<!-- Librería AR.js para tracking óptico --> <script src="https://raw.githack.com/AR-jsorg/AR.js/master/aframe/build/aframe-ar.js"></script> </head> <body style="margin: 0; overflow:
hidden;"> <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode:
mono_and_matrix; matrixCodeType: 3x3;"> <!-- Anclaje al Marcador Óptico Hiro --> <a-marker
preset="hiro" id="marcador-hiro"> <!-- PANEL HOLOGRÁFICO INDUSTRIAL SUPERPUESTO --> <a-entity
position="0 0.5 0"> <!-- Caja contenedora translúcida --> <a-box position="0 0 0" width="1.2"
height="0.8" depth="0.1" material="color: #0f172a; opacity: 0.85; transparent: true"> </a-box> <!-
- Anillo indicador giratorio --> <a-ring position="0 0 0.08" radius-inner="0.2" radiusouter="0.25" color="#38bdf8" animation="property: rotation; to: 0 0 360; loop: true; dur: 5000;
easing: linear"> </a-ring> <!-- Texto Dinámico de Telemetría --> <a-text value="MOTOR PRINCIPAL
#01\nPRESION: 4.2 BAR\nTEMP: 68.5 C [OPTIMO]" position="0 0 0.12" align="center" color="#ffffff"
scale="0.35 0.35 0.35"> </a-text> </a-entity> </a-marker> <!-- Cámara AR --> <a-entity camera></aentity> </a-scene> </body> </html>
