<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laboratorio Módulo 3: Assets GLTF y Audio Espacial HRTF</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene background="color: #0284c7">
    <a-assets>
      <a-asset-item id="modelo-robot" src="https://cdn.aframe.io/test-models/models/glTF-2.0/virtualcity/VC.gltf" crossorigin="anonymous"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #bae6fd; intensity: 1.0" position="-3 5 2"></a-entity>

    <a-entity gltf-model="#modelo-robot" position="0 0 -6" scale="0.01 0.01 0.01" rotation="0 180 0"></a-entity>

    <a-entity id="fuente-alta-frecuencia" position="-3 1.5 -4">
      <a-sphere radius="0.25" color="#ec4899" animation="property: scale; to: 1.25 1.25 1.25; dir: alternate; loop: true; dur: 500"></a-sphere>
      <a-text value="EMISOR IZQ (AGUDO)\nAlta Freq [880 Hz]\n(Exponential HRTF)" position="0 0.5 0" align="center" scale="0.45 0.45 0.45"></a-text>
    </a-entity>

    <a-entity id="fuente-baja-frecuencia" position="3 1.5 -4">
      <a-sphere radius="0.25" color="#10b981" animation="property: scale; to: 1.25 1.25 1.25; dir: alternate; loop: true; dur: 1000"></a-sphere>
      <a-text value="EMISOR DER (GRAVE)\nBaja Freq [220 Hz]\n(Exponential HRTF)" position="0 0.5 0" align="center" scale="0.45 0.45 0.45"></a-text>
    </a-entity>

    <div id="btn-audio" style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 999; background: #0f172a; color: #38bdf8; padding: 10px 18px; font-family: monospace; font-size: 14px; border: 2px solid #38bdf8; border-radius: 8px; cursor: pointer;">
      ▶ CLIC AQUÍ PARA INICIAR AUDIO ESPACIAL 3D
    </div>

    <a-camera position="0 1.6 0" look-controls wasd-controls></a-camera>
  </a-scene>

  <script>
    function generarTonoWavDataURI(freq, duracion = 1.0, sampleRate = 22050) {
      const numSamples = Math.floor(duracion * sampleRate);
      const buffer = new Uint8Array(44 + numSamples);
      const view = new DataView(buffer.buffer);

      // Cabecera RIFF / WAVE
      const escribirTexto = (offset, str) => {
        for (let i = 0; i < str.length; i++) buffer[offset + i] = str.charCodeAt(i);
      };
      escribirTexto(0, 'RIFF');
      view.setUint32(4, 36 + numSamples, true);
      escribirTexto(8, 'WAVEfmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate, true);
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true); // 8-bit
      escribirTexto(36, 'data');
      view.setUint32(40, numSamples, true);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const val = Math.sin(2 * Math.PI * freq * t);
        buffer[44 + i] = Math.floor((val * 0.4 + 0.5) * 255);
      }

      let binario = '';
      for (let i = 0; i < buffer.byteLength; i++) {
        binario += String.fromCharCode(buffer[i]);
      }
      return 'data:audio/wav;base64,' + btoa(binario);
    }

    const uriAgudo = generarTonoWavDataURI(880, 0.6); // Alta frecuencia
    const uriGrave = generarTonoWavDataURI(220, 1.2); // Baja frecuencia

    const btn = document.querySelector('#btn-audio');
    const entIzq = document.querySelector('#fuente-alta-frecuencia');
    const entDer = document.querySelector('#fuente-baja-frecuencia');

    btn.addEventListener('click', () => {
      entIzq.setAttribute('sound', {
        src: uriAgudo,
        autoplay: true,
        loop: true,
        positional: true,
        volume: 2.0,
        refDistance: 1,
        maxDistance: 12,
        rolloffFactor: 2,
        distanceModel: 'exponential'
      });

      entDer.setAttribute('sound', {
        src: uriGrave,
        autoplay: true,
        loop: true,
        positional: true,
        volume: 2.5,
        refDistance: 1,
        maxDistance: 12,
        rolloffFactor: 2,
        distanceModel: 'exponential'
      });

      btn.style.display = 'none';
      console.log('[Web Audio 3D] Fuentes estéreo HRTF inicializadas con modelo exponencial.');
    });
  </script>
</body>
</html>
